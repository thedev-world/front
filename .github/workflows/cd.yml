name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag or SHA to deploy manually (e.g. v1.2.3 or v1.2.3-sha-abc1234)"
        required: true

env:
  IMAGE: ${{ secrets.SCW_REGISTRY }}/devplanet-front

jobs:
  # ---------------------------------------------------------------------------
  # Build & Push - Builds the image directly from the release commit
  # ---------------------------------------------------------------------------
  build-and-push:
    if: github.event_name == 'release'
    name: Build & Push Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA and tag info
        id: meta
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | head -c7)" >> $GITHUB_OUTPUT
          echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Log in to Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg BACKEND_URL=http://api:8000 \
            --build-arg NEXT_PUBLIC_API_URL= \
            -t ${{ env.IMAGE }}:${{ steps.meta.outputs.tag_name }} \
            -t ${{ env.IMAGE }}:${{ steps.meta.outputs.tag_name }}-sha-${{ steps.meta.outputs.short_sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image tags
        run: |
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.tag_name }}
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.tag_name }}-sha-${{ steps.meta.outputs.short_sha }}
          docker push ${{ env.IMAGE }}:latest

  # ---------------------------------------------------------------------------
  # Deploy - Deploys to prod after build (release) or manually (dispatch)
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    # Execute if workflow is dispatched manually OR if release build-and-push succeeded
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'release' && needs.build-and-push.result == 'success'))
    name: Deploy to prod
    runs-on: ubuntu-latest

    steps:
      - name: Get deploy tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}-sha-$(echo ${{ github.sha }} | head -c7)" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/devplanet/devplanet-infra/scripts/deploy.sh front ${{ steps.meta.outputs.tag }}
