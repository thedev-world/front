services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_NETWORK_GITHUB_URL=${NEXT_PUBLIC_NETWORK_GITHUB_URL:-}
        - NEXT_PUBLIC_NETWORK_DISCORD_URL=${NEXT_PUBLIC_NETWORK_DISCORD_URL:-}
        - NEXT_PUBLIC_NETWORK_X_URL=${NEXT_PUBLIC_NETWORK_X_URL:-}
    container_name: devplanet-front
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - devplanet-network

networks:
  devplanet-network:
    name: devplanet-network
    driver: bridge
